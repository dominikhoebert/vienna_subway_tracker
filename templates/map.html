<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vienna Subway Tracker</title>
<style>
  :root {
    --ink: #1d2433;
    --muted: #6b7385;
    --line: #e3e7ee;
    --surface: rgba(255, 255, 255, 0.94);
    --accent: #1f6feb;
    --due: #ffd60a;
    --countdown: #c2185b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #eef2f6;
  }

  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.7rem 1.2rem;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 6px rgba(20, 30, 50, 0.06);
    z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
  .logo {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e53935, #1f6feb 55%, #43a047);
    box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.12);
  }
  .brand strong { display: block; font-size: 1rem; letter-spacing: -0.01em; }
  #status { display: block; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }

  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  svg.dragging { cursor: grabbing; }
  svg polyline, svg circle { vector-effect: non-scaling-stroke; }
  text {
    font-size: calc(12px * var(--k, 1));
    paint-order: stroke;
    stroke: #fff;
    stroke-width: calc(3.5px * var(--k, 1));
    stroke-linejoin: round;
    fill: var(--ink);
  }
  .countdown {
    fill: var(--countdown);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .panel {
    position: absolute;
    left: 1rem;
    bottom: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding: 0.7rem 0.8rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 8px 28px rgba(20, 30, 50, 0.14);
    backdrop-filter: blur(6px);
    font-size: 0.86rem;
  }
  .toggle { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; }
  .zoom { display: flex; align-items: center; gap: 0.4rem; padding-top: 0.5rem; border-top: 1px solid var(--line); }
  #zoomLevel { min-width: 3.2rem; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
  button {
    font: inherit;
    color: var(--ink);
    width: 32px;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: #f1f4f9; }
  button:active { transform: scale(0.94); }
  button.text { width: auto; border-radius: 999px; padding: 0 0.8rem; margin-left: auto; font-size: 0.8rem; }

  .legend {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--line);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .legend span { display: flex; align-items: center; gap: 0.5rem; }
  .legend i {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1.5px solid #222;
  }
  .legend i.d1 { background: #1f6feb; }
  .legend i.d2 { background: #ff5ca8; }

  .attrib {
    position: absolute;
    right: 0.6rem;
    bottom: 0.4rem;
    padding: 0.15rem 0.5rem;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.8);
    font-size: 0.7rem;
    color: var(--muted);
    text-decoration: none;
  }
  .attrib:hover { color: var(--ink); }

  @media (max-width: 640px) {
    header { padding: 0.6rem 0.8rem; }
    .attrib { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo"></span>
    <div>
      <strong>Vienna Subway Tracker</strong>
      <span id="status">Loading…</span>
    </div>
  </div>
  <span class="spacer"></span>
</header>
<main class="stage">
  <svg id="map" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="panel">
    <label class="toggle"><input type="checkbox" id="showNames" checked> Station names</label>
    <label class="toggle"><input type="checkbox" id="showDepartures" checked> Countdowns</label>
    <div class="zoom">
      <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
      <span id="zoomLevel">1.0×</span>
      <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zoomReset" class="text" title="Reset view">Reset</button>
    </div>
    <div class="legend">
      <span><i class="d1"></i>→ Direction 1</span>
      <span><i class="d2"></i>← Direction 2</span>
      <span>Large dot: at station · small dot: next minute</span>
    </div>
  </div>
  <a class="attrib" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>
</main>
<script>
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const REFRESH_MS = 30000;
  const MAP_SIZE = 1000;
  const MAX_ZOOM = 12;
  const ZOOM_STEP = 1.5;
  const WHEEL_SENSITIVITY = 0.0015;
  const DIRECTION_COLORS = { '1': '#1f6feb', '2': '#ff5ca8' };
  const BASEMAP_ZOOM = 13;
  const BASEMAP_OPACITY = 0.6;
  const svg = document.getElementById('map');
  const statusEl = document.getElementById('status');
  const zoomLevel = document.getElementById('zoomLevel');
  const showNames = document.getElementById('showNames');
  const showDepartures = document.getElementById('showDepartures');
  let data = null;
  let view = { x: 0, y: 0, w: MAP_SIZE };
  let drag = null;
  let basemapBuilt = false;
  let previous = new Map();
  const content = document.createElementNS(SVG_NS, 'g');
  svg.append(content);

  function el(name, attrs = {}, text) {
    const node = document.createElementNS(SVG_NS, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  function setView(next) {
    const w = clamp(next.w, MAP_SIZE / MAX_ZOOM, MAP_SIZE);
    view = {
      w,
      x: clamp(next.x, 0, MAP_SIZE - w),
      y: clamp(next.y, 0, MAP_SIZE - w),
    };
    svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.w}`);
    svg.style.setProperty('--k', view.w / MAP_SIZE);
    zoomLevel.textContent = `${(MAP_SIZE / view.w).toFixed(1)}×`;
    draw();
  }

  function buildBasemap({ x: [ax, bx], y: [ay, by] }) {
    const n = 2 ** BASEMAP_ZOOM;
    const lonAt = px => (px - bx) / ax;
    const latAt = py => (py - by) / ay;
    const tileX = lon => clamp(Math.floor((lon + 180) / 360 * n), 0, n - 1);
    const tileY = lat => {
      const r = lat * Math.PI / 180;
      return clamp(Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n), 0, n - 1);
    };
    const tileLon = x => x / n * 360 - 180;
    const tileLat = y => Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))) * 180 / Math.PI;

    const lons = [lonAt(0), lonAt(MAP_SIZE)];
    const lats = [latAt(0), latAt(MAP_SIZE)];
    const tiles = el('g', { opacity: BASEMAP_OPACITY });
    for (let x = tileX(Math.min(...lons)); x <= tileX(Math.max(...lons)); x++) {
      for (let y = tileY(Math.max(...lats)); y <= tileY(Math.min(...lats)); y++) {
        const x1 = ax * tileLon(x) + bx;
        const x2 = ax * tileLon(x + 1) + bx;
        const y1 = ay * tileLat(y) + by;
        const y2 = ay * tileLat(y + 1) + by;
        tiles.append(el('image', {
          href: `https://tile.openstreetmap.org/${BASEMAP_ZOOM}/${x}/${y}.png`,
          x: Math.min(x1, x2),
          y: Math.min(y1, y2),
          width: Math.abs(x2 - x1),
          height: Math.abs(y2 - y1),
          preserveAspectRatio: 'none',
        }));
      }
    }
    svg.prepend(tiles);
    basemapBuilt = true;
  }

  function zoomAt(factor, clientX, clientY) {
    const point = svg.createSVGPoint();
    point.x = clientX;
    point.y = clientY;
    const p = point.matrixTransform(svg.getScreenCTM().inverse());
    const w = view.w / factor;
    const ratio = w / view.w;
    setView({
      w,
      x: p.x - (p.x - view.x) * ratio,
      y: p.y - (p.y - view.y) * ratio,
    });
  }

  function zoomCenter(factor) {
    const rect = svg.getBoundingClientRect();
    zoomAt(factor, rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  function overlaps(a, b) {
    return a.x0 < b.x1 && b.x0 < a.x1 && a.y0 < b.y1 && b.y0 < a.y1;
  }

  // Moves the label next to its station, trying right, left, above and below.
  // Returns false when every spot collides with a station or another label.
  function placeLabel(group, station, k, occupied) {
    const b = group.getBBox();
    const gap = 8 * k;
    const spots = [
      { tx: station.x + gap - b.x, ty: station.y - (b.y + b.height / 2) },
      { tx: station.x - gap - (b.x + b.width), ty: station.y - (b.y + b.height / 2) },
      { tx: station.x - (b.x + b.width / 2), ty: station.y - gap - (b.y + b.height) },
      { tx: station.x - (b.x + b.width / 2), ty: station.y + gap - b.y },
    ];
    for (const { tx, ty } of spots) {
      const box = { x0: b.x + tx, y0: b.y + ty, x1: b.x + b.width + tx, y1: b.y + b.height + ty };
      if (occupied.some(other => overlaps(box, other))) continue;
      group.setAttribute('transform', `translate(${tx} ${ty})`);
      occupied.push(box);
      return true;
    }
    return false;
  }

  // Maps "direction|station" to the stations directly before it on the line patterns.
  function buildPrevious(lines) {
    const previous = new Map();
    for (const line of lines) {
      for (const [direction, names] of Object.entries(line.directions)) {
        names.forEach((name, i) => {
          if (i === 0 || names[i - 1] === name) return;
          const key = `${direction}|${name}`;
          if (!previous.has(key)) previous.set(key, new Set());
          previous.get(key).add(names[i - 1]);
        });
      }
    }
    return previous;
  }

  function draw() {
    if (!data) return;
    const k = view.w / MAP_SIZE;
    const stations = new Map(data.stations.map(station => [station.name, station]));
    const lineLayer = el('g', { fill: 'none', 'stroke-width': 4.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    for (const line of data.lines) {
      for (const names of Object.values(line.directions)) {
        const points = names.map(name => stations.get(name)).map(s => `${s.x},${s.y}`).join(' ');
        lineLayer.append(el('polyline', { points, stroke: line.color, opacity: 0.85 }));
      }
    }

    const stationLayer = el('g', { stroke: '#1d2433', 'stroke-width': 2 });
    const labelLayer = el('g');
    const occupied = [];
    for (const station of data.stations) {
      const r = 4 * k;
      stationLayer.append(el('circle', { cx: station.x, cy: station.y, r, fill: '#fff' }));
      occupied.push({ x0: station.x - r, y0: station.y - r, x1: station.x + r, y1: station.y + r });
    }
    const trainLayer = el('g', { stroke: '#1d2433', 'stroke-width': 1.5 });
    for (const station of data.stations) {
      const atStation = Object.keys(DIRECTION_COLORS).filter(direction => station.departures[direction]?.[0] === 0);
      atStation.forEach((direction, i) => {
        const offset = (i - (atStation.length - 1) / 2) * 9 * k;
        trainLayer.append(el('circle', { cx: station.x + offset, cy: station.y, r: 4.5 * k, fill: DIRECTION_COLORS[direction] }));
      });
      for (const direction of Object.keys(DIRECTION_COLORS)) {
        if (station.departures[direction]?.[0] !== 1) continue;
        for (const name of previous.get(`${direction}|${station.name}`) ?? []) {
          const from = stations.get(name);
          trainLayer.append(el('circle', {
            cx: (station.x + from.x) / 2,
            cy: (station.y + from.y) / 2,
            r: 5 * k,
            fill: DIRECTION_COLORS[direction],
          }));
        }
      }
    }

    content.replaceChildren(lineLayer, stationLayer, trainLayer, labelLayer);

    for (const station of data.stations) {
      const group = el('g');
      if (showNames.checked) group.append(el('text', { x: 0, y: 0 }, station.name));
      if (showDepartures.checked) {
        let row = showNames.checked ? 1 : 0;
        for (const [direction, countdowns] of Object.entries(station.departures)) {
          if (!countdowns.length) continue;
          const arrow = direction === '1' ? '→' : '←';
          group.append(el('text', { x: 0, y: 13 * row * k, class: 'countdown' }, `${arrow} ${countdowns.join(' · ')} min`));
          row++;
        }
      }
      if (!group.childNodes.length) continue;
      labelLayer.append(group);
      if (!placeLabel(group, station, k, occupied)) group.remove();
    }
  }

  async function refresh() {
    try {
      const response = await fetch('/map/data');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      data = await response.json();
      previous = buildPrevious(data.lines);
      if (!basemapBuilt && data.projection) buildBasemap(data.projection);
      draw();
      statusEl.textContent = `Updated ${data.timestamp}`;
    } catch (error) {
      statusEl.textContent = `Update failed: ${error.message}`;
    }
  }

  svg.addEventListener('wheel', event => {
    event.preventDefault();
    const delta = clamp((event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY), -200, 200);
    zoomAt(Math.exp(-delta * WHEEL_SENSITIVITY), event.clientX, event.clientY);
  }, { passive: false });

  svg.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    drag = { x: event.clientX, y: event.clientY, view: { ...view } };
    svg.setPointerCapture(event.pointerId);
    svg.classList.add('dragging');
  });

  svg.addEventListener('pointermove', event => {
    if (!drag) return;
    const scale = svg.getScreenCTM().a;
    setView({
      w: view.w,
      x: drag.view.x - (event.clientX - drag.x) / scale,
      y: drag.view.y - (event.clientY - drag.y) / scale,
    });
  });

  function endDrag() {
    drag = null;
    svg.classList.remove('dragging');
  }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  document.getElementById('zoomIn').addEventListener('click', () => zoomCenter(ZOOM_STEP));
  document.getElementById('zoomOut').addEventListener('click', () => zoomCenter(1 / ZOOM_STEP));
  document.getElementById('zoomReset').addEventListener('click', () => setView({ w: MAP_SIZE, x: 0, y: 0 }));
  showNames.addEventListener('change', draw);
  showDepartures.addEventListener('change', draw);
  setView(view);
  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
